# X Certbot - 证书自动化声明式配置
#
# 用途: 集中描述「要申请/续期哪些域名」以及「续期后同步到哪些云平台」。
#       由 .github/workflows/cert-sync.yml 读取，也可以通过仓库 Variable DOMAINS_CONFIG 指向别处。
#
# 安全: 本文件【只放非敏感信息】。
#       所有访问密钥一律走 GitHub Environment `PROD`（见 docs/07-github-actions-cert-sync.md 第 4 节），
#       不要写进这个文件，也不要提交到仓库。唯一要写在这里的“个人信息”是 ACME 邮箱——它不是机密。
#
# 中文域名: 可以直接写 "例子.测试"，脚本会自动转成 punycode（xn--...）后再申请。
#           证书目录、云平台绑定都以 punycode 形式出现，这是 Let's Encrypt 的要求。
#
# Environment `PROD` 里需要配置的四个凭据（ID 走 Variables，Key 走 Secrets）:
#   ALIYUN_SECRET_ID_DNS    (variables)  阿里云 RAM AccessKeyId，LTAI 前缀
#   ALIYUN_SECRET_KEY_DNS   (secrets)    阿里云 RAM AccessKeySecret
#   CLOUDBASE_SECRET_ID     (variables)  腾讯云 SecretId，AKID 前缀
#   CLOUDBASE_SECRET_KEY    (secrets)    腾讯云 SecretKey
#
# 证书同步用的阿里云密钥（可选，不配则回退用上面那对——但只给 DNS 权限的密钥
# 调用 CAS/CDN 会被拒）:
#   ALIYUN_SECRET_ID_CERT   (variables)  阿里云 RAM AccessKeyId
#   ALIYUN_SECRET_KEY_CERT  (secrets)    阿里云 RAM AccessKeySecret

version: 1

# ---------------------------------------------------------------------------
# 全局默认值（可被单个域名覆盖）
# ---------------------------------------------------------------------------
defaults:
  # ACME CA。acme.sh 的默认 CA 是 ZeroSSL，这里显式指定 Let's Encrypt。
  server: letsencrypt
  # 密钥长度。RSA 2048 是刻意选的：腾讯云 SSL UploadCertificate 的文档示例只出现 RSA 私钥。
  # 想改用 ECC 就写 ec-256（脚本会自动加 --ecc 参数），但请先在腾讯云侧验证一次。
  key_length: 2048
  # DNS TXT 记录写入后等待多少秒再做校验。阿里云/腾讯云 DNS 一般 60 秒足够。
  dns_propagation_seconds: 60
  # ACME 账户邮箱。邮箱【不是机密】，所以刻意不从 Secrets 读。
  # 保持占位值 / 留空时，workflow 会在「解析配置并生成执行计划」这一步就报错并提示改这里。
  email: "badstyle@qq.com"

# ---------------------------------------------------------------------------
# 同步目标的全局默认值
#
# 只填你实际要用的目标；没配、或 enabled: false 的目标会被跳过，不产生任何请求。
# ---------------------------------------------------------------------------
sync:
  # 腾讯云 CloudBase：上传证书到腾讯云 SSL，再把自定义域名重绑到新证书。
  # 前置条件（三条都满足再打开）：
  #   1) Environment `PROD` 里已配置 CLOUDBASE_SECRET_ID / CLOUDBASE_SECRET_KEY（CAM 子账号）
  #   2) 下面或域名条目里填了真实的 env_id
  #   3) 该域名【已经】在 CloudBase 里绑定过（首次绑定要手工跑一次 `tcb domains add`）
  cloudbase:
    enabled: false
    env_id: ""
    domains: []
    routes_apply: false
    routes: []
    delete_old_cert: false
  aliyun:
    # 上传到阿里云证书库（CAS）
    cas:
      enabled: true
      name_prefix: "LE"
    # 部署到 CDN / DCDN，默认关闭；有对应产品时再打开并填 domains
    cdn:
      enabled: false
      domains: []
    dcdn:
      enabled: false
      domains: []

# ---------------------------------------------------------------------------
# 要管理的域名
# ---------------------------------------------------------------------------
domains:
  # 泛域名证书：同时覆盖 xsin.work 与 *.xsin.work（含 gitalk.xsin.work）
  - name: xsin.work
    dns_provider: aliyun
    wildcard: true
    sync:
      cloudbase:
        enabled: true
        env_id: "ai-matrix-sh01-d2ghj0buc22bd7e13"
        # 要重绑的 CloudBase 自定义域名。注意证书是泛域名，但 CloudBase 是
        # 按【具体主机名】绑定证书的，所以这里写实际绑过的那个主机。
        domains:
          - gitalk.xsin.work
        # 首次绑定请在控制台或 CLI 完成；这里只负责证书换新后重绑，避免误改线上路由
        routes_apply: false
        routes: []
        delete_old_cert: false
      aliyun:
        cas:
          enabled: true
          name_prefix: "LE"
        cdn:
          enabled: false
          domains: []
        dcdn:
          enabled: false
          domains: []
